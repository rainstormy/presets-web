# Configure pnpm and manage third-party dependencies.
# https://pnpm.io/settings

# Declare third-party dependencies installed in `node_modules`.
#
# IMPORTANT: Always add a comment that describes why we need that dependency and if it has any special maintenance requirements.
# Keep in mind that adding a new dependency may increase the risk of supply chain attacks, as the attack surface grows.
catalog:
  # Type definitions for the Node.js standard library.
  # https://nodejs.org/docs/latest/api
  # https://github.com/DefinitelyTyped/DefinitelyTyped/tree/master/types/node
  '@types/node': 24.13.2

  # Lefthook is a Git hooks manager.
  # https://lefthook.dev
  lefthook: 2.1.8

  # Oxfmt is an opinionated code formatter.
  # https://oxc.rs/docs/guide/usage/formatter.html
  oxfmt: 0.60.0

  # Oxlint is a TypeScript linter.
  # https://oxc.rs/docs/guide/usage/linter.html
  oxlint: 1.75.0

  # This Oxlint plugin provides type-aware linting rules.
  # https://github.com/oxc-project/tsgolint
  oxlint-tsgolint: 7.0.2001

  # The official 'tsc' CLI for TypeScript, including the language service (LSP) and Go-powered compiler (tsgo).
  # https://www.typescriptlang.org
  typescript: 7.0.2

  # Vite+ is a unified toolchain and task runner for Oxfmt, Oxlint, tsdown, Vite, and Vitest.
  # It is also a version manager of Node.js and pnpm.
  # https://viteplus.dev
  vite-plus: 0.2.5

  # Vitest is a unit testing framework.
  # https://vitest.dev
  vitest: 4.1.10

# Be very strict about third-party dependencies to reduce the risk of supply chain attacks.
# https://pnpm.io/blog/2025/12/05/newsroom-npm-supply-chain-security
catalogMode: strict
minimumReleaseAge: 4200 # minutes = 70 hours (3 days minus 2 hours to account for scheduling offsets in Renovate)
savePrefix: ''
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4200 # minutes

# Disallow all script execution during package installation.
allowBuilds:
  lefthook: false

# Let some packages bypass the minimum release age requirement to allow urgent security upgrades to be installed despite being less than 3 days old.
minimumReleaseAgeExclude:
  - '@oxfmt/binding-android-arm-eabi@0.60.0'
  - '@oxfmt/binding-android-arm64@0.60.0'
  - '@oxfmt/binding-darwin-arm64@0.60.0'
  - '@oxfmt/binding-darwin-x64@0.60.0'
  - '@oxfmt/binding-freebsd-x64@0.60.0'
  - '@oxfmt/binding-linux-arm-gnueabihf@0.60.0'
  - '@oxfmt/binding-linux-arm-musleabihf@0.60.0'
  - '@oxfmt/binding-linux-arm64-gnu@0.60.0'
  - '@oxfmt/binding-linux-arm64-musl@0.60.0'
  - '@oxfmt/binding-linux-ppc64-gnu@0.60.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.60.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.60.0'
  - '@oxfmt/binding-linux-s390x-gnu@0.60.0'
  - '@oxfmt/binding-linux-x64-gnu@0.60.0'
  - '@oxfmt/binding-linux-x64-musl@0.60.0'
  - '@oxfmt/binding-openharmony-arm64@0.60.0'
  - '@oxfmt/binding-win32-arm64-msvc@0.60.0'
  - '@oxfmt/binding-win32-ia32-msvc@0.60.0'
  - '@oxfmt/binding-win32-x64-msvc@0.60.0'
  - '@oxlint/binding-android-arm-eabi@1.75.0'
  - '@oxlint/binding-android-arm64@1.75.0'
  - '@oxlint/binding-darwin-arm64@1.75.0'
  - '@oxlint/binding-darwin-x64@1.75.0'
  - '@oxlint/binding-freebsd-x64@1.75.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.75.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.75.0'
  - '@oxlint/binding-linux-arm64-gnu@1.75.0'
  - '@oxlint/binding-linux-arm64-musl@1.75.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.75.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.75.0'
  - '@oxlint/binding-linux-riscv64-musl@1.75.0'
  - '@oxlint/binding-linux-s390x-gnu@1.75.0'
  - '@oxlint/binding-linux-x64-gnu@1.75.0'
  - '@oxlint/binding-linux-x64-musl@1.75.0'
  - '@oxlint/binding-openharmony-arm64@1.75.0'
  - '@oxlint/binding-win32-arm64-msvc@1.75.0'
  - '@oxlint/binding-win32-ia32-msvc@1.75.0'
  - '@oxlint/binding-win32-x64-msvc@1.75.0'
  - '@oxlint-tsgolint/darwin-arm64@7.0.2001'
  - '@oxlint-tsgolint/darwin-x64@7.0.2001'
  - '@oxlint-tsgolint/linux-arm64@7.0.2001'
  - '@oxlint-tsgolint/linux-x64@7.0.2001'
  - '@oxlint-tsgolint/win32-arm64@7.0.2001'
  - '@oxlint-tsgolint/win32-x64@7.0.2001'
  - oxfmt@0.60.0
  - oxlint@1.75.0
  - oxlint-tsgolint@7.0.2001

# Consolidate transitive dependency versions with the ones specified in the catalog.
overrides:
  oxfmt: 'catalog:'
  oxlint: 'catalog:'
  oxlint-tsgolint: 'catalog:'
